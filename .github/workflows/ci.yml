name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub's runner, not the Debian box: the repo is public, and a self-hosted
    # runner would run code from anyone's pull request on the box.
    # The image has Chrome at /opt/google/chrome/chrome, which playwright.config.ts uses.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Includes the /dev-editor harness the end-to-end tests drive.
          VITE_DEV_HARNESS: '1'

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: '1'
