name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The Debian box runner: Node 22 and Chrome at /opt/google/chrome/chrome.
    # No sudo and no `playwright install`; playwright.config.ts uses system Chrome.
    runs-on: [self-hosted]
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Includes the /dev-editor harness the end-to-end tests drive.
          VITE_DEV_HARNESS: '1'

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: '1'
