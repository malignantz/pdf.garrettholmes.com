<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<title>PDF Workspace · pdf.garrettholmes.com</title>
		<meta
			name="description"
			content="Merge, reorder, rotate, sign and type on PDFs in your browser. Free, no uploads: files stay on your device, and every export is checked before you download it."
		/>
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#211e18" media="(prefers-color-scheme: dark)" />
		<meta name="referrer" content="no-referrer" />
		<meta name="apple-mobile-web-app-title" content="PDF Workspace" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
